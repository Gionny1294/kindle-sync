name: kindle-sync
x-common: &common
  image: ${KINDLE_SYNC_IMAGE:-kindle-sync:local}
  restart: unless-stopped
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - ./data:/data
    - ${LIBRARY_HOST_PATH:-./library}:/library:ro
    - ${BOOK_DOWNLOAD_HOST_PATH:-./library/Singoli}:/book-downloads:ro
  environment:
    BOOK_DOWNLOAD_DIR: /book-downloads
  tmpfs:
    - /tmp:size=128m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
services:
  app:
    <<: *common
    build:
      context: ${KINDLE_SYNC_SOURCE:-.}
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: .env
    environment:
      BOOK_DOWNLOAD_DIR: /book-downloads
    volumes:
      - ./data:/data
      - ${LIBRARY_HOST_PATH:-./library}:/library:ro
      - ${BOOK_DOWNLOAD_HOST_PATH:-./library/Singoli}:/book-downloads
      - ./.kindle-updater/status:/update-status:ro
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-1997}:1997"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1997/healthz', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
  worker:
    <<: *common
    command: [python, -m, app.worker]
    stop_grace_period: 3m
    healthcheck:
      test: [CMD, python, -c, "import time; from app.core import connect,setting; db=connect(); assert time.time()-float(setting(db,'heartbeat'))<180"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
